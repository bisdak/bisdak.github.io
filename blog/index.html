<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog — Your Name</title>
    <meta name="description" content="Notes on software, tools, and whatever I'm learning." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="../assets/css/style.css?v=skills-ai" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : true;
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container">
        <a class="brand" href="../index.html">Your Name</a>

        <nav class="nav" id="nav" aria-label="Main">
          <a href="../index.html#projects">Projects</a>
          <a href="../index.html#about">About</a>
          <a href="../resume.html">Resume</a>
          <a href="index.html" aria-current="page">Blog</a>
          <a href="../index.html#contact">Contact</a>
        </nav>

        <div class="header-tools">
          <button class="icon-button theme-toggle" type="button" aria-label="Toggle theme">
            <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          </button>
          <button
            class="icon-button nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="nav"
            aria-label="Toggle menu"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="section" style="border-top: 0">
        <div class="container">
          <div class="section-head">
            <span class="eyebrow">Writing</span>
            <h1 style="font-size: clamp(2rem, 5vw, 2.8rem)">Blog</h1>
            <p>Notes on software, tools, and whatever I'm learning.</p>
          </div>

          <!-- Populated from posts.json by assets/js/blog.js -->
          <ul class="post-list" id="post-list"></ul>
          <noscript>
            <p class="empty-state">
              This list needs JavaScript. You can also browse
              <a href="posts/hello-world.html">the latest post</a> directly.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span data-year>2026</span> Your Name</p>
        <div class="footer-links">
          <a href="../index.html">Home</a>
          <a href="https://github.com/your-username">GitHub</a>
          <a href="mailto:you@example.com">Email</a>
        </div>
      </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/blog.js"></script>
  </body>
</html>
